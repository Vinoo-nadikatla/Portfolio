  <style>
    /* ====================================================================
       EDITORIAL DESIGN SYSTEM — inverted (cream on black)
       Inspired by oversized monochrome magazine portfolios.
       ==================================================================== */
    :root {
      --font-display: "Anton", sans-serif;
      --font-serif: "Newsreader", serif;
      --font-body: "Archivo", sans-serif;

      /* palette — overridden by [data-palette] below */
      --bg: #0c0c0d;
      --ink: #ece6da;          /* warm cream — primary */
      --ink-strong: #fbf9f4;   /* near-white highlight */
      --muted: rgba(236, 230, 218, 0.55);
      --faint: rgba(236, 230, 218, 0.34);
      --rule: rgba(236, 230, 218, 0.16);
      --rule-soft: rgba(236, 230, 218, 0.09);
      --cell: rgba(236, 230, 218, 0.025);
      --invert-bg: #ece6da;    /* hover/active fill */
      --invert-ink: #0c0c0d;

      --wave-color: 0x171a1f;
      --wave-opacity: 0.42;
      --wave-blend: screen;
      --grade: radial-gradient(120% 80% at 50% -10%, rgba(255,255,255,0.05), rgba(0,0,0,0) 55%),
               radial-gradient(130% 100% at 50% 120%, rgba(0,0,0,0.6), rgba(0,0,0,0) 60%);
    }

    [data-palette="paper"] {
      --bg: #efeadf;
      --ink: #1a1710;
      --ink-strong: #0a0805;
      --muted: rgba(26, 23, 16, 0.72);
      --faint: rgba(26, 23, 16, 0.48);
      --rule: rgba(26, 23, 16, 0.24);
      --rule-soft: rgba(26, 23, 16, 0.12);
      --cell: rgba(26, 23, 16, 0.035);
      --invert-bg: #1a1710;
      --invert-ink: #efeadf;
      --wave-color: 0xdcd2bf;
      --wave-opacity: 0.5;
      --wave-blend: multiply;
      --grade: radial-gradient(120% 80% at 50% -10%, rgba(255,255,255,0.4), rgba(255,255,255,0) 55%),
               radial-gradient(130% 100% at 50% 120%, rgba(40,30,12,0.16), rgba(0,0,0,0) 62%),
               radial-gradient(100% 100% at 50% 50%, rgba(0,0,0,0) 60%, rgba(30,22,8,0.12) 100%);
    }

    [data-palette="graphite"] {
      --bg: #15181c;
      --ink: #dde0e4;
      --ink-strong: #ffffff;
      --muted: rgba(221, 224, 228, 0.55);
      --faint: rgba(221, 224, 228, 0.34);
      --rule: rgba(221, 224, 228, 0.15);
      --rule-soft: rgba(221, 224, 228, 0.08);
      --cell: rgba(221, 224, 228, 0.03);
      --invert-bg: #dde0e4;
      --invert-ink: #15181c;
      --wave-color: 0x2a3038;
      --wave-opacity: 0.5;
      --wave-blend: screen;
      --grade: radial-gradient(120% 80% at 50% -10%, rgba(255,255,255,0.06), rgba(0,0,0,0) 55%),
               radial-gradient(130% 100% at 50% 120%, rgba(0,0,0,0.5), rgba(0,0,0,0) 60%);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: clip;
    }

    ::selection { background: var(--ink); color: var(--bg); }

    /* ---- type primitives ---- */
    .ed-display {
      font-family: var(--font-display);
      text-transform: uppercase;
      color: var(--ink-strong);
      line-height: 0.82;
      letter-spacing: -0.01em;
      font-weight: 400;
      margin: 0;
    }
    /* Anton is already heavy/condensed; Oswald/Archivo Black need help */
    [data-display="oswald"] { --font-display: "Oswald", sans-serif; }
    [data-display="oswald"] .ed-display { font-weight: 700; letter-spacing: -0.02em; }
    [data-display="archivo-black"] { --font-display: "Archivo Black", sans-serif; }
    [data-display="archivo-black"] .ed-display { line-height: 0.9; letter-spacing: -0.03em; }

    .ed-serif { font-family: var(--font-serif); font-style: italic; font-weight: 400; }
    .ed-label {
      font-family: var(--font-body);
      text-transform: uppercase;
      letter-spacing: 0.28em;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
    }
    .ed-num {
      font-family: var(--font-display);
      color: var(--ink-strong);
      line-height: 0.8;
      font-weight: 400;
    }
    .ed-rule { border-top: 1px solid var(--rule); }
    .ed-rule-b { border-bottom: 1px solid var(--rule); }

    a { color: inherit; text-decoration: none; }

    /* ---- layout shells ---- */
    .ed-section { position: relative; padding: 7rem 2.5rem; }
    @media (max-width: 900px) { .ed-section { padding: 4.5rem 1.25rem; } }

    /* the fixed vertical nameplate rail */
    .ed-rail {
      position: fixed;
      top: 0; left: 0;
      height: 100vh;
      width: 4rem;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 0;
      border-right: 1px solid var(--rule-soft);
      background: transparent;
      pointer-events: none;
      mix-blend-mode: difference;
    }
    .ed-rail .ed-rail-name {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      letter-spacing: 0.34em;
      font-size: 11px;
      text-transform: uppercase;
      color: #fff;
      font-family: var(--font-body);
      font-weight: 500;
      white-space: nowrap;
    }
    .ed-rail .ed-rail-mark { font-family: var(--font-display); color: #fff; font-size: 20px; line-height: 1; }
    .ed-rail .ed-rail-year { writing-mode: vertical-rl; font-size: 10px; letter-spacing: 0.3em; color: #fff; font-family: var(--font-body); }
    @media (max-width: 900px) { .ed-rail { display: none; } }

    /* ---- editorial cell (flat, hairline, invert on hover) ---- */
    .ed-cell {
      position: relative;
      background: var(--cell);
      border: 1px solid var(--rule);
      transition: background 0.4s cubic-bezier(0.16,1,0.3,1), color 0.4s ease, transform 0.4s cubic-bezier(0.16,1,0.3,1);
      will-change: transform;
    }
    a.ed-cell:hover, button.ed-cell:hover {
      background: var(--invert-bg);
      color: var(--invert-ink);
    }
    .ed-cell .ed-display, .ed-cell .ed-num { transition: color 0.4s ease; }
    a.ed-cell:hover .ed-display, button.ed-cell:hover .ed-display,
    a.ed-cell:hover .ed-num, button.ed-cell:hover .ed-num { color: var(--invert-ink); }
    a.ed-cell:hover .ed-muted, button.ed-cell:hover .ed-muted { color: var(--invert-ink); opacity: 0.7; }
    a.ed-cell:hover .ed-label, button.ed-cell:hover .ed-label { color: var(--invert-ink); opacity: 0.65; }
    a.ed-cell:hover .ed-chip, button.ed-cell:hover .ed-chip { border-color: rgba(0,0,0,0.25); color: var(--invert-ink); }
    a.ed-cell:hover .ed-arrow, button.ed-cell:hover .ed-arrow { opacity: 1; transform: translate(0,0); }

    .ed-muted { color: var(--muted); }
    .ed-faint { color: var(--faint); }
    .ed-strong { color: var(--ink-strong); }

    .ed-chip {
      display: inline-flex; align-items: center; gap: 0.4rem;
      border: 1px solid var(--rule);
      padding: 0.3rem 0.7rem;
      font-size: 11px;
      letter-spacing: 0.04em;
      color: var(--muted);
      white-space: nowrap;
      transition: border-color 0.4s ease, color 0.4s ease;
    }

    .ed-arrow { opacity: 0; transform: translate(-4px, 4px); transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.16,1,0.3,1); }

    /* underline link */
    .ed-link { position: relative; }
    .ed-link::after { content:""; position:absolute; left:0; bottom:-2px; height:1px; width:100%; background: currentColor; transform: scaleX(0); transform-origin: left; transition: transform 0.4s cubic-bezier(0.16,1,0.3,1); }
    .ed-link:hover::after { transform: scaleX(1); }

    /* solid button */
    .ed-btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: var(--invert-bg); color: var(--invert-ink);
      font-family: var(--font-body); font-weight: 600; font-size: 13px;
      letter-spacing: 0.02em; text-transform: uppercase;
      padding: 0.85rem 1.4rem; border: 1px solid var(--invert-bg);
      transition: background 0.35s ease, color 0.35s ease;
    }
    .ed-btn:hover { background: transparent; color: var(--ink-strong); border-color: var(--ink-strong); }
    .ed-btn-ghost {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: transparent; color: var(--ink-strong);
      font-family: var(--font-body); font-weight: 600; font-size: 13px;
      letter-spacing: 0.02em; text-transform: uppercase;
      padding: 0.85rem 1.4rem; border: 1px solid var(--rule);
      transition: border-color 0.35s ease, background 0.35s ease, color 0.35s ease;
    }
    .ed-btn-ghost:hover { border-color: var(--ink-strong); }

    /* background wave field */
    #ed-bg { position: fixed; inset: 0; z-index: 0; }
    #ed-bg .ed-wave { position: absolute; inset: 0; opacity: var(--wave-opacity); mix-blend-mode: var(--wave-blend); transition: opacity 0.5s ease; }
    #ed-bg .ed-grade { position: absolute; inset: 0; background: var(--grade); pointer-events: none; }
    #ed-content { position: relative; z-index: 1; }

    /* image slot theming — the component's empty-state frame/ring/caption are
       near-black (built for light pages); give the host a pale "photo frame"
       fill so the empty placeholder is visible on our dark canvas. A dropped
       photo fills edge-to-edge; the hairline border reads as an editorial frame. */
    image-slot { background: #ded8ca; border: 1px solid var(--rule); }

    /* ---- scroll reveals (IntersectionObserver-driven) ---- */
    .ed-rise-inner { transform: translateY(108%); transition: transform 0.9s cubic-bezier(0.16,1,0.3,1); }
    .ed-rise-inner.is-in { transform: translateY(0); }

    .ed-fade { opacity: 0; transform: translateY(var(--ed-y, 26px)); filter: blur(8px);
      transition: opacity 0.75s cubic-bezier(0.16,1,0.3,1), transform 0.75s cubic-bezier(0.16,1,0.3,1), filter 0.75s ease; }
    .ed-fade.is-in { opacity: 1; transform: translateY(0); filter: blur(0); }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .ed-rise-inner { transform: none !important; }
      .ed-fade { opacity: 1 !important; transform: none !important; filter: none !important; }
    }

    /* nav */
    .ed-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 45;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.1rem 2.5rem;
      mix-blend-mode: difference;
    }
    @media (max-width: 900px) { .ed-nav { padding: 1rem 1.25rem; } }
    .ed-nav a { color: #fff; }
    .ed-nav-links { display: flex; gap: 1.6rem; }
    @media (max-width: 760px) { .ed-nav-links { display: none; } }
    .ed-nav-links a { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 500; opacity: 0.85; transition: opacity 0.3s; }
    .ed-nav-links a:hover { opacity: 1; }

    /* ---- paper theme refinements: legibility + brighter, more open type ---- */
    [data-palette="paper"] .ed-nav { mix-blend-mode: normal; }
    [data-palette="paper"] .ed-nav a { color: var(--ink-strong); }
    [data-palette="paper"] .ed-nav-links a { opacity: 0.88; }
    [data-palette="paper"] .ed-nav-links a:hover { opacity: 1; }
    /* open up the leading so stacked headings don't crowd in this theme */
    [data-palette="paper"] .ed-display { line-height: 0.96; }
    /* keep the giant hero name from overlapping line-to-line */
    [data-palette="paper"] .hero-name .ed-display { line-height: 1.0; }
  </style>
</head>
